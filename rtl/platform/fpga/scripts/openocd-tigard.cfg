# Tigard v1 JTAG adapter wrapper for the CoreJack riscv-dbg target.
# Used by boards whose external JTAG header is wired to the Tigard
# (currently the AXKU5); selected via debug.openocd_cfg in the board
# descriptor.

source [find interface/ftdi/tigard.cfg]
transport select jtag

source [file join [file dirname [info script]] openocd-riscv-target.cfg]
