# Olimex ARM-USB-TINY (15ba:0004) JTAG adapter wrapper for the CoreJack
# riscv-dbg target. Used by boards whose external JTAG header is wired to
# the Olimex (currently the Arty A7-100T); selected via debug.openocd_cfg
# in the board descriptor.

source [find interface/ftdi/olimex-jtag-tiny.cfg]
transport select jtag

source [file join [file dirname [info script]] openocd-riscv-target.cfg]
