package:
  name: corejack/platform
  authors:
    - CoreJack contributors

dependencies:
  apb:
    git: https://github.com/pulp-platform/apb.git
    version: 0.2.4
  axi:
    git: https://github.com/pulp-platform/axi.git
    version: 0.39.1
  common_cells:
    git: https://github.com/pulp-platform/common_cells.git
    version: 1.39.0
  idma:
    git: https://github.com/pulp-platform/iDMA.git
    version: 0.6.5
  clint:
    git: https://github.com/pulp-platform/clint.git
    rev: d5390a805c20f9226758a152ba1645f61da73349
  obi:
    git: https://github.com/pulp-platform/obi.git
    version: 0.1.7
  apb_uart:
    git: https://github.com/pulp-platform/apb_uart.git
    rev: 8182a85d234417db46fe833533f8536644d3bee3
  riscv-dbg:
    git: https://github.com/pulp-platform/riscv-dbg.git
    rev: 1cd764a82d7d49c5e8679fbb70b540b2e274bab9

vendor_package:
  - name: serv
    target_dir: .bender/vendor/serv
    upstream:
      git: https://github.com/olofk/serv.git
      rev: f5ddfaa6378a958f0797146a6f8b2bcf72ce4e3b
  - name: picorv32
    target_dir: .bender/vendor/picorv32
    upstream:
      git: https://github.com/YosysHQ/picorv32.git
      rev: 87c89acc18994c8cf9a2311e871818e87d304568
  - name: cvw
    target_dir: .bender/vendor/cvw
    upstream:
      git: https://github.com/openhwgroup/cvw.git
      rev: 03f16461df99ac6de077a0549693c887fa04892d
  - name: cv32e40p
    target_dir: .bender/vendor/cv32e40p
    upstream:
      git: https://github.com/openhwgroup/cv32e40p.git
      rev: 6033d2b1be3295ec774d17ac4cf226faacfdeb08
  - name: cv32e40x
    target_dir: .bender/vendor/cv32e40x
    upstream:
      git: https://github.com/openhwgroup/cv32e40x.git
      rev: d952cd63bc1b4eb58cd893c28ef8283c781e345e
  - name: cv32e40s
    target_dir: .bender/vendor/cv32e40s
    upstream:
      git: https://github.com/openhwgroup/cv32e40s.git
      rev: 9d9cae78b01a11458953133d1173c61933a2ba86

