name: smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Run fast project checks
        shell: bash
        run: |
          source ./sourceme.sh
          make python-tests
          make support-matrix-check
          make version-check
          make board-check BOARD=axku5
          make target-check BOARD=axku5
          make axi-addr-map-check

      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v2
        with:
          version: '5.050'

      - name: Run smoke test
        shell: bash
        run: |
          source ./sourceme.sh
          make smoke
